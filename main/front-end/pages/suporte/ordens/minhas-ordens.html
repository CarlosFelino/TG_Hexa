<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Ordens | Support Nexus</title>
    
    <link rel="stylesheet" href="../../../assets/css/global.css">
    <link rel="stylesheet" href="../../../assets/css/suporte.css">
    <link rel="stylesheet" href="../../../assets/css/minhas-ordens.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="../../../assets/images/logo.png" type="image/x-icon">
</head>

<body class="suporte-dashboard">
    <header class="suporte-navbar">
        <div class="navbar-content">
            <button class="menu-toggle" aria-label="Abrir menu">
                <i class="fas fa-bars"></i>
            </button>

            <a href="../painel-suporte.html" class="logo-link">
                <div class="logo-container">
                    <img src="../../../assets/images/logo.png" alt="Support Nexus" class="logo">
                    <span class="logo-text">Support Nexus</span>
                </div>
            </a>

            <div class="user-profile">
                <div class="profile-info">
                    <span class="user-name" id="userName">Suporte</span>
                    <span class="user-email" id="userEmail">suporte@fatec.sp.gov.br</span>
                </div>
                <div class="profile-dropdown">
                    <img src="../../../assets/images/default-avatar.png" alt="Foto do Suporte" class="profile-avatar" id="userAvatar">
                    <div class="dropdown-content">
                        <a href="../perfil-suporte.html"><i class="fas fa-user"></i> Meu Perfil</a>
                        <a href="../../../index.html" id="logout"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <aside class="sidebar">
        <nav class="sidebar-nav">
            <ul>
                <li>
                    <a href="../painel-suporte.html">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="listar-ordens.html">
                        <i class="fas fa-list-ul"></i>
                        <span>Listar Ordens</span>
                    </a>
                </li>
                <li>
                    <a href="criar-ordem.html">
                        <i class="fas fa-plus-circle"></i>
                        <span>Criar Ordem</span>
                    </a>
                </li>
                <li>
                    <a href="minhas-ordens.html" class="active">
                        <i class="fas fa-user-cog"></i>
                        <span>Minhas Ordens</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="suporte-content">
        <div class="orders-header">
            <h1><i class="fas fa-clipboard-list"></i> Minhas Ordens de Serviço</h1>
            
            <div class="filters-container">
                <div class="filter-group">
                    <button class="filter-btn active" data-status="all"><i class="fas fa-list"></i> Todas</button>
                    <button class="filter-btn" data-status="pending"><i class="fas fa-clock"></i> Pendentes</button>
                    <button class="filter-btn" data-status="in-progress"><i class="fas fa-spinner"></i> Em Andamento</button>
                    <button class="filter-btn" data-status="completed"><i class="fas fa-check-circle"></i> Concluídas</button>
                </div>
                <div class="filter-group">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-orders" placeholder="Buscar por sala, equipamento...">
                    </div>
                    <div class="date-filter">
                        <label for="date-from">De:</label>
                        <input type="date" id="date-from">
                        <label for="date-to">Até:</label>
                        <input type="date" id="date-to">
                        <button id="apply-dates" class="small-btn"><i class="fas fa-filter"></i></button>
                    </div> 
                </div>
            </div>
        </div>

        <div class="stats-summary">
            <div class="stat-card">
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-value" id="pendingOrders">0</div>
                <div class="stat-label">Pendentes</div>
            </div>
            <div class="stat-card in-progress">
                <div class="stat-value" id="inProgressOrders">0</div>
                <div class="stat-label">Em Andamento</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-value" id="completedOrders">0</div>
                <div class="stat-label">Concluídas</div>
            </div>
        </div>

        <div class="orders-list" id="orders-list">
            <div class="no-orders">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Carregando suas ordens...</p>
            </div>
        </div>

        <div class="pagination" id="pagination"></div>
    </main>

    <div id="modal-order-details" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalhes da Ordem</h3>
                <span class="modal-close">&times;</span>
            </div>
            <div class="modal-body" id="modal-order-details">
                </div>
        </div>
    </div>

    <div id="feedback-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Avaliar Atendimento</h3>
          <span class="modal-close">&times;</span>
        </div>
        <div class="modal-body feedback-body">
          <div class="stars-container">
            <i class="fa fa-star" data-value="1"></i>
            <i class="fa fa-star" data-value="2"></i>
            <i class="fa fa-star" data-value="3"></i>
            <i class="fa fa-star" data-value="4"></i>
            <i class="fa fa-star" data-value="5"></i>
          </div>
        </div>
        <div class="modal-footer" style="margin-top: 20px; text-align: right;">
          <button id="submit-feedback" class="btn btn-primary">Enviar</button>
        </div>
      </div>
    </div>

    <div class="overlay"></div>

    <script src="../../../assets/js/globalCred.js"></script>
    <script src="../../../assets/js/minhas-ordens.js"></script>
    <script src="../../../assets/js/globalProfile.js"></script>
    <script src="../../../assets/js/suporte.js"></script> </body>
</html>
