<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Ordens | Support Nexus</title>
    
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/suporte.css">
    
    <link rel="stylesheet" href="../../assets/css/minhas-ordens.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/x-icon">
</head>

<body class="suporte-dashboard"> <header class="suporte-navbar">
        <div class="navbar-content">
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            <a href="painel-professor.html" class="logo-link">
                <div class="logo-container">
                    <img src="../../assets/images/logo.png" alt="Logo" class="logo">
                    <span class="logo-text">Support Nexus</span>
                </div>
            </a>
            <div class="user-profile">
                <div class="profile-info">
                    <span class="user-name" id="userName"></span>
                    <span class="user-email" id="userEmail"></span>
                </div>
                <div class="profile-dropdown">
                    <img src="../../assets/images/default-avatar.png" alt="Avatar" class="profile-avatar">
                    <div class="dropdown-content">
                        <a href="perfil-professor.html"><i class="fas fa-user"></i> Perfil</a>
                        <a href="../../index.html" id="logout"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <aside class="sidebar">
        <nav class="sidebar-nav">
            <ul>
                <li><a href="painel-professor.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="criar-ordem.html"><i class="fas fa-plus-circle"></i> Criar Ordem</a></li>
                <li><a href="minhas-ordens.html" class="active"><i class="fas fa-list-ul"></i> Minhas Ordens</a></li>
            </ul>
        </nav>
    </aside>


    <main class="suporte-content">
        <div class="orders-header">
            <h1><i class="fas fa-clipboard-list"></i> Minhas Ordens de Serviço</h1>
            
            <div class="filters-container">
                <div class="filter-group">
                    <button class="filter-btn active" data-status="all"><i class="fas fa-list"></i> Todas</button>
                    <button class="filter-btn" data-status="pending"><i class="fas fa-clock"></i> Pendentes</button>
                    <button class="filter-btn" data-status="in-progress"><i class="fas fa-spinner"></i> Em Andamento</button>
                    <button class="filter-btn" data-status="completed"><i class="fas fa-check-circle"></i> Concluídas</button>
                </div>
                <div class="filter-group">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-orders" placeholder="Buscar...">
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-summary">
            <div class="stat-card"><div class="stat-value" id="totalOrders">0</div><div class="stat-label">Total</div></div>
            <div class="stat-card pending"><div class="stat-value" id="pendingOrders">0</div><div class="stat-label">Pendentes</div></div>
            <div class="stat-card in-progress"><div class="stat-value" id="inProgressOrders">0</div><div class="stat-label">Andamento</div></div>
            <div class="stat-card completed"><div class="stat-value" id="completedOrders">0</div><div class="stat-label">Concluídas</div></div>
        </div>

        <div class="orders-list" id="orders-list">
            <div class="no-orders"><i class="fas fa-spinner fa-spin"></i> Carregando...</div>
        </div>
    </main>

    <div id="order-details-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Detalhes</h3><span class="modal-close">&times;</span></div>
            <div class="modal-body" id="modal-order-details"></div>
        </div>
    </div>

    <div class="overlay"></div>

    <script src="../../assets/js/globalCred.js"></script>
    <script src="../../assets/js/globalProfile.js"></script>
    <script src="../../assets/js/suporte.js"></script>
    <script src="../../assets/js/minhas-ordens.js"></script>
</body>
</html>
